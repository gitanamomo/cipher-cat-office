<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no" />
  <title>机密密室：密码猫与黄铜魔盒 · Cipher Cat: The Mystery of the Brass Box</title>
  <meta name="description" content="1930年代复古侦探密室逃脱解谜游戏 — 携手猫咪神探菲利克斯破译书架机关、黄铜星辰魔盒、重型金库与蒸汽朋克密码筒！" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800;900&family=Courier+Prime:ital,wght@0,400;0,700;1,400&family=Playfair+Display:ital,wght@0,600;0,800;1,500&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #120b07;
      color: #ecdcc8;
      font-family: "Playfair Display", "PingFang SC", "Songti SC", Georgia, serif;
      overflow: hidden;
      user-select: none;
    }
    .writing-vertical {
      writing-mode: vertical-rl;
      text-orientation: mixed;
    }
    @keyframes hotspotPulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(212, 175, 55, 0.55); }
      50% { box-shadow: 0 0 14px 4px rgba(212, 175, 55, 0.35); }
    }
    .hotspot-hint {
      animation: hotspotPulse 2.6s infinite ease-in-out;
    }
  </style>
</head>
<body class="bg-[#120b07] text-[#ecdcc8] overflow-hidden">
  <div id="root"></div>

  <script>
    const { useState, useEffect, useRef } = React;
    const h = React.createElement;

    // ================= 1930s Noir Procedural Web Audio Synthesizer =================
    class SoundFX {
      constructor() {
        this.ctx = null;
        this.enabled = true;
      }
      init() {
        if (!this.ctx) {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (AudioCtx) this.ctx = new AudioCtx();
        }
        if (this.ctx && this.ctx.state === "suspended") {
          this.ctx.resume();
        }
      }
      click() {
        if (!this.enabled) return;
        this.init();
        if (!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = "triangle";
        osc.frequency.setValueAtTime(600, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(120, this.ctx.currentTime + 0.04);
        gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.04);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.04);
      }
      gearClunk() {
        if (!this.enabled) return;
        this.init();
        if (!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = "sawtooth";
        osc.frequency.setValueAtTime(180, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(45, this.ctx.currentTime + 0.12);
        gain.gain.setValueAtTime(0.4, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.12);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.12);
      }
      typewriter() {
        if (!this.enabled) return;
        this.init();
        if (!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = "square";
        osc.frequency.setValueAtTime(1200 + Math.random() * 400, this.ctx.currentTime);
        gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.03);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.03);
      }
      tumbler() {
        if (!this.enabled) return;
        this.init();
        if (!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = "sine";
        osc.frequency.setValueAtTime(800, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(300, this.ctx.currentTime + 0.06);
        gain.gain.setValueAtTime(0.25, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.06);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.06);
      }
      puzzleSolved() {
        if (!this.enabled) return;
        this.init();
        if (!this.ctx) return;
        const notes = [440, 554.37, 659.25, 880];
        notes.forEach((freq, idx) => {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          const startTime = this.ctx.currentTime + idx * 0.12;
          osc.type = "triangle";
          osc.frequency.setValueAtTime(freq, startTime);
          gain.gain.setValueAtTime(0.28, startTime);
          gain.gain.exponentialRampToValueAtTime(0.001, startTime + 0.4);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(startTime);
          osc.stop(startTime + 0.4);
        });
      }
      itemPickup() {
        if (!this.enabled) return;
        this.init();
        if (!this.ctx) return;
        const notes = [523.25, 659.25, 783.99];
        notes.forEach((freq, idx) => {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          const startTime = this.ctx.currentTime + idx * 0.08;
          osc.type = "sine";
          osc.frequency.setValueAtTime(freq, startTime);
          gain.gain.setValueAtTime(0.25, startTime);
          gain.gain.exponentialRampToValueAtTime(0.001, startTime + 0.3);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(startTime);
          osc.stop(startTime + 0.3);
        });
      }
      catMeow() {
        if (!this.enabled) return;
        this.init();
        if (!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = "sine";
        const now = this.ctx.currentTime;
        osc.frequency.setValueAtTime(400, now);
        osc.frequency.exponentialRampToValueAtTime(750, now + 0.15);
        osc.frequency.exponentialRampToValueAtTime(500, now + 0.35);
        gain.gain.setValueAtTime(0.01, now);
        gain.gain.linearRampToValueAtTime(0.25, now + 0.08);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.35);
      }
      clueReveal() {
        if (!this.enabled) return;
        this.init();
        if (!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = "sine";
        osc.frequency.setValueAtTime(329.63, this.ctx.currentTime);
        osc.frequency.linearRampToValueAtTime(493.88, this.ctx.currentTime + 0.25);
        gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.3);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.3);
      }
    }
    const sfx = new SoundFX();

    const ASSETS = {
      OFFICE: "./manus-storage/detective_office_scene_362ea1d3.svg",
      PUZZLE_BOX: "./manus-storage/mechanical_puzzle_box_2cd60e14.svg",
      CRYPTEX: "./manus-storage/steampunk_cryptex_ae567270.svg",
      CAT: "./manus-storage/detective_cat_572d83e6.svg",
    };

    // ================= 1930s Film Grain Overlay =================
    function FilmGrainOverlay({ enabled }) {
      const canvasRef = useRef(null);
      useEffect(() => {
        if (!enabled) return;
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext("2d");
        if (!ctx) return;
        let animId;
        let frame = 0;
        const render = () => {
          frame++;
          if (frame % 3 === 0) {
            const w = (canvas.width = Math.max(160, Math.floor(window.innerWidth / 4)));
            const h = (canvas.height = Math.max(90, Math.floor(window.innerHeight / 4)));
            const imgData = ctx.createImageData(w, h);
            const data = imgData.data;
            for (let i = 0; i < data.length; i += 4) {
              const val = Math.random() * 255;
              data[i] = val;
              data[i + 1] = val;
              data[i + 2] = val;
              data[i + 3] = Math.random() < 0.08 ? 32 : 10;
            }
            ctx.putImageData(imgData, 0, 0);
          }
          animId = requestAnimationFrame(render);
        };
        render();
        return () => cancelAnimationFrame(animId);
      }, [enabled]);

      if (!enabled) return null;
      return h("div", { className: "pointer-events-none fixed inset-0 z-40 overflow-hidden" },
        h("canvas", { ref: canvasRef, className: "w-full h-full opacity-55 mix-blend-overlay" }),
        h("div", { className: "absolute inset-0 bg-[#7a532d]/15 mix-blend-color pointer-events-none" }),
        h("div", {
          className: "absolute inset-0 pointer-events-none",
          style: { boxShadow: "inset 0 0 110px rgba(10, 5, 2, 0.8), inset 0 0 36px rgba(0, 0, 0, 0.9)" }
        })
      );
    }

    // ================= Puzzle 1: Secret Bookshelf Modal =================
    const BOOKS = [
      { id: "truth", title: "I. Truth & Consequence (真相)", spineColor: "#7a2e22", height: "h-44" },
      { id: "shadows", title: "II. Shadows of Cairo (暗影)", spineColor: "#2d4b3d", height: "h-40" },
      { id: "always", title: "III. Always in the Dark (总会)", spineColor: "#2f3b59", height: "h-48" },
      { id: "clues", title: "IV. Clues in the Dust (尘埃)", spineColor: "#5a4628", height: "h-36" },
      { id: "finds", title: "V. Finds of the Nile (找到)", spineColor: "#6a3857", height: "h-44" },
      { id: "way", title: "VI. Way of the Falcon (出路)", spineColor: "#3a505b", height: "h-42" },
    ];
    const TARGET_SEQ = ["truth", "always", "finds", "way"];

    function BookshelfModal({ onClose, onSolve, isAlreadySolved, lang }) {
      const [selected, setSelected] = useState([]);
      const [solved, setSolved] = useState(isAlreadySolved);
      const [feedback, setFeedback] = useState(
        isAlreadySolved
          ? (lang === "zh" ? "秘密书架机关已解开，暗格中的齿轮扳手已取出！" : "The secret shelf has slid aside, revealing Whitmore's hidden compartment!")
          : (lang === "zh" ? "按照墙上侦探格言的词序（Truth → Always → Finds → Way），依次抽动对应的4本古书！" : "Select and tilt the books in the order of Whitmore's detective motto.")
      );

      const pullBook = (id) => {
        if (solved) return;
        sfx.click();
        const next = [...selected, id];
        setSelected(next);
        const currentIndex = next.length - 1;
        if (TARGET_SEQ[currentIndex] === id) {
          if (next.length === TARGET_SEQ.length) {
            sfx.gearClunk();
            setTimeout(() => sfx.puzzleSolved(), 200);
            setSolved(true);
            setFeedback(lang === "zh" ? "咔哒——轰隆！四本古书咬合联动，秘密暗格弹出，书桌上的黄铜机关盒通电了！" : "CLICK-CLACK! The four books depress into the shelf! A hidden brass compartment pops out!");
            onSolve();
          } else {
            setFeedback(lang === "zh" ? `第 ${next.length} 本书卡入弹簧锁位！继续选择下一本。` : `Book ${next.length} clicks into a spring lock! Keep going.`);
          }
        } else {
          sfx.click();
          setFeedback(lang === "zh" ? "机关发出一阵异响并弹回原位！顺序不对，请对照格言重新抽选。" : "The shelf mechanism rattles and springs back out! Incorrect motto order.");
          setTimeout(() => setSelected([]), 400);
        }
      };

      return h("div", { className: "fixed inset-0 z-50 flex items-center justify-center bg-black/85 backdrop-blur-sm p-4" },
        h("div", { className: "relative w-full max-w-3xl bg-[#2e1f13] border-8 border-[#1a110a] rounded-xl shadow-2xl p-6 text-[#ecdcc8] flex flex-col" },
          h("button", {
            onClick: onClose,
            className: "absolute top-3 right-3 bg-[#1a110a] text-[#ecdcc8] px-3 py-1 text-sm font-bold rounded hover:bg-[#47301e] border border-[#6b492f]"
          }, lang === "zh" ? "✕ 关闭" : "✕ CLOSE"),
          h("h2", { className: "text-2xl font-bold uppercase tracking-wider text-[#d4af37] mb-1 flex items-center gap-2" },
            h("span", null, "📚"),
            lang === "zh" ? "第一关：维多利亚红木机关书架" : "The Secret Bookshelf"
          ),
          h("p", { className: "text-xs text-[#a89078] mb-4" },
            lang === "zh" ? "藏有连杆暗锁的古董精装侦探小说书架" : "Hollowed Victorian Oak Bookshelf with Hidden Lever Mechanism"
          ),
          h("div", { className: "bg-[#1f140c] p-3 rounded-lg border border-[#4a3420] text-center text-sm mb-6 text-[#f5ebd7]" }, feedback),
          h("div", { className: "relative w-full bg-[#3d2716] p-6 rounded-lg border-4 border-[#1b1109] shadow-inner flex items-end justify-center gap-3 min-h-[250px] pb-4" },
            h("div", { className: "absolute bottom-0 left-0 right-0 h-4 bg-[#1e130a] border-t-2 border-[#54361e]" }),
            BOOKS.map((book) => {
              const isPulled = selected.includes(book.id);
              return h("button", {
                key: book.id,
                disabled: solved,
                onClick: () => pullBook(book.id),
                className: `relative w-16 ${book.height} rounded-t-sm shadow-xl flex flex-col justify-between items-center p-2 text-white transition-all duration-200 hover:-translate-y-2 active:scale-95 border-2 border-black/40 ${isPulled ? "translate-y-4 brightness-125 ring-2 ring-[#d4af37]" : ""}`,
                style: { backgroundColor: book.spineColor }
              },
                h("div", { className: "text-[11px] font-bold tracking-tight writing-vertical text-[#e6c885] select-none h-full flex items-center justify-center text-center" }, book.title),
                h("div", { className: "w-full h-1 bg-[#d4af37] opacity-60" })
              );
            })
          ),
          h("div", { className: "mt-6 pt-3 border-t border-[#4a3420] flex justify-between items-center text-xs" },
            h("div", { className: "text-[#a89078] italic" },
              lang === "zh" ? "墙上相框格言提示：“TRUTH ALWAYS FINDS A WAY”（依次点第 I、III、V、VI 本）" : "Clue on wall poster: “TRUTH ALWAYS FINDS A WAY”"
            ),
            h("button", {
              onClick: () => {
                sfx.gearClunk();
                setSelected(TARGET_SEQ);
                setSolved(true);
                sfx.puzzleSolved();
                setFeedback(lang === "zh" ? "菲利克斯猫爪一拨，自动解开了书架机关！" : "Bookshelf sequence automatically completed!");
                onSolve();
              },
              className: "text-[#d4af37] hover:underline font-bold"
            }, lang === "zh" ? "[ 🐾 猫咪侦探一键解开 ]" : "[ Felix Cat Auto-Solve ]")
          )
        )
      );
    }

    // ================= Puzzle 2: Mechanical Brass Puzzle Box Modal =================
    const SYMBOLS = ["★", "☾", "👁", "▲", "⬟", "☼"];
    function PuzzleBoxModal({ onClose, onSolve, isAlreadySolved, boxImage, lang }) {
      const [dials, setDials] = useState(isAlreadySolved ? [0, 1, 2, 3] : [2, 4, 1, 5]);
      const [solved, setSolved] = useState(isAlreadySolved);
      const [feedback, setFeedback] = useState(
        isAlreadySolved
          ? (lang === "zh" ? "黄铜星辰机关盒已开启，银质保险箱旋钮已收入背包！" : "The brass cylinders have locked into place, the inner chamber is open!")
          : (lang === "zh" ? "转动 4 个黄铜转轮，对准打字机备忘录记载的四象秘符：★ 星星 → ☾ 新月 → 👁 全视之眼 → ▲ 金字塔！" : "Align the four esoteric symbols: ★ Star, ☾ Moon, 👁 Eye, ▲ Pyramid!")
      );

      const rotateDial = (index, direction) => {
        if (solved) return;
        sfx.click();
        setDials((prev) => {
          const next = [...prev];
          next[index] = (next[index] + direction + SYMBOLS.length) % SYMBOLS.length;
          if (next[0] === 0 && next[1] === 1 && next[2] === 2 && next[3] === 3) {
            sfx.gearClunk();
            setTimeout(() => sfx.puzzleSolved(), 200);
            setSolved(true);
            setFeedback(lang === "zh" ? "咔哒——嗡嗡！四枚黄铜齿轮完美啮合，秘密夹层弹出「银质保险箱旋钮」！" : "CLICK-WHIRRR! The brass gears engage! A secret drawer slides out!");
            onSolve();
          } else {
            setFeedback(lang === "zh" ? `已转动第 ${index + 1} 号齿轮转环。目标序列：★  ☾  👁  ▲` : `Dial ${index + 1} turned. Target: ★ ☾ 👁 ▲`);
          }
          return next;
        });
      };

      return h("div", { className: "fixed inset-0 z-50 flex items-center justify-center bg-black/85 backdrop-blur-sm p-4" },
        h("div", { className: "relative w-full max-w-4xl bg-[#e3d5be] border-4 border-[#3c2a1a] rounded-lg shadow-2xl p-6 text-[#2a1c12] flex flex-col md:flex-row gap-6" },
          h("button", {
            onClick: onClose,
            className: "absolute top-3 right-3 bg-[#3c2a1a] text-[#e3d5be] px-3 py-1 text-sm font-bold rounded hover:bg-[#5a3e26] border border-[#8c6747]"
          }, lang === "zh" ? "✕ 关闭" : "✕ CLOSE"),
          h("div", { className: "md:w-1/2 flex flex-col items-center" },
            h("div", { className: "relative border-4 border-[#5a3e26] rounded-md overflow-hidden shadow-inner bg-[#26170d] w-full" },
              h("img", { src: boxImage, alt: "Mechanical Puzzle Box", className: "w-full h-auto object-cover max-h-[320px]" }),
              solved && h("div", { className: "absolute inset-0 bg-[#d4af37]/25 flex items-center justify-center" },
                h("span", { className: "bg-[#2a1a0c] text-[#d4af37] px-4 py-2 rounded-lg font-bold border-2 border-[#d4af37] shadow-xl text-lg" },
                  lang === "zh" ? "✓ 机关已开启" : "UNLOCKED"
                )
              )
            ),
            h("div", { className: "mt-3 text-xs text-[#5c4028] text-center italic bg-[#d9c7a7] p-2 rounded border border-[#bda582] w-full" },
              lang === "zh"
                ? "“当星辰(★)与新月(☾)连珠，全视之眼(👁)将注视神圣金字塔(▲)。” —— 惠特莫尔手记"
                : "“As the stars align with the moon, the eye beholds the sacred pyramid.” — Whitmore's Journal"
            )
          ),
          h("div", { className: "md:w-1/2 flex flex-col justify-between" },
            h("div", null,
              h("div", { className: "border-b-2 border-[#8c6747] pb-2 mb-4" },
                h("h2", { className: "text-2xl font-bold tracking-wide text-[#3c2a1a] uppercase flex items-center gap-2" },
                  h("span", null, "⚙"),
                  lang === "zh" ? "第二关：黄铜星辰机关盒" : "The Brass Puzzle Box"
                ),
                h("p", { className: "text-xs text-[#6e4e32]" },
                  lang === "zh" ? "雷顿教授风精密机械符号锁" : "Professor Layton Style Mystery Chamber"
                )
              ),
              h("p", { className: "text-sm leading-relaxed mb-4 bg-[#f2e7d3] p-3 rounded border border-[#caa982]" }, feedback),
              h("div", { className: "grid grid-cols-4 gap-3 text-center my-4" },
                dials.map((val, idx) =>
                  h("div", { key: idx, className: "flex flex-col items-center bg-[#cbb898] p-2 rounded-lg border-2 border-[#7a5938] shadow" },
                    h("span", { className: "text-[10px] uppercase font-bold tracking-wider text-[#4a3522] mb-1" },
                      lang === "zh" ? `转轮 ${idx + 1}` : `Ring ${idx + 1}`
                    ),
                    h("button", {
                      disabled: solved,
                      onClick: () => rotateDial(idx, -1),
                      className: "w-10 h-8 bg-[#8c6747] hover:bg-[#a67c52] text-[#fff] font-bold rounded flex items-center justify-center shadow active:scale-95 disabled:opacity-40"
                    }, "▲"),
                    h("div", { className: "my-2 w-12 h-14 bg-[#2e1d11] text-[#f4d06f] text-2xl font-bold flex items-center justify-center rounded border-2 border-[#9e764e] shadow-inner" },
                      SYMBOLS[val]
                    ),
                    h("button", {
                      disabled: solved,
                      onClick: () => rotateDial(idx, 1),
                      className: "w-10 h-8 bg-[#8c6747] hover:bg-[#a67c52] text-[#fff] font-bold rounded flex items-center justify-center shadow active:scale-95 disabled:opacity-40"
                    }, "▼")
                  )
                )
              )
            ),
            h("div", { className: "pt-4 border-t border-[#8c6747] flex justify-between items-center" },
              h("button", {
                onClick: () => {
                  sfx.gearClunk();
                  setDials([0, 1, 2, 3]);
                  setSolved(true);
                  sfx.puzzleSolved();
                  setFeedback(lang === "zh" ? "已自动对齐 ★ ☾ 👁 ▲，机关盒开启！" : "Auto-aligned mechanism unlocked!");
                  onSolve();
                },
                className: "text-xs text-[#7c5a3a] hover:underline font-bold"
              }, lang === "zh" ? "[ 🐾 猫咪侦探一键对齐 ]" : "[ Detective Felix Auto-Solve ]"),
              solved && h("span", { className: "text-xs bg-[#4a7c38] text-white px-3 py-1 rounded-full font-bold" },
                lang === "zh" ? "✓ 已获银质保险箱旋钮" : "✓ Solved! Items Retrieved"
              )
            )
          )
        )
      );
    }

    // ================= Puzzle 3: Heavy Wall Safe Modal =================
    function SafeModal({ onClose, onSolve, isAlreadySolved, lang }) {
      const [currentVal, setCurrentVal] = useState(10);

      const turnDial = (delta) => {

        sfx.tumbler();
        setCurrentVal((currentVal + delta + 40) % 40);
      };

      const confirmNumber = () => {
        if (solved) return;
        sfx.click();
        if (stage === 0) {

            sfx.tumbler();
            setStage(1);
            setFeedback(lang === "zh" ? "咔哒！第一段密码 [10] 锁定成功！请继续旋转到 [4] 并点击确认。" : "Tumbler 1 clicks firmly into place! [10 confirmed]");

            setFeedback(lang === "zh" ? `刻度 ${currentVal} 不正确！第1段密码请看墙上挂钟指针 (10)。` : `Number ${currentVal} is incorrect. Try 10.`);
            setStage(0);
          }
        } else if (stage === 1) {
          if (currentVal === 4) {
            sfx.tumbler();
            setStage(2);
            setFeedback(lang === "zh" ? "咔哒！第二段密码 [4] 锁定成功！请继续旋转到 [28] 并点击确认。" : "Tumbler 2 engages! [4 confirmed]");
          } else {
            setFeedback(lang === "zh" ? `刻度 ${currentVal} 不正确！第2段密码请看书桌抽屉铭牌 (4)，锁芯已重置。` : `Number ${currentVal} is incorrect. Lock resets.`);
            setStage(0);
          }
        } else if (stage === 2) {
          if (currentVal === 28) {
            sfx.gearClunk();
            setTimeout(() => sfx.puzzleSolved(), 200);
            setSolved(true);
            setFeedback(lang === "zh" ? "轰隆！重型门栓退回，金库大门滑开！你获得了「蒸汽朋克密码筒」！" : "CLANG! The heavy bolt slides back! The wall safe is OPEN!");
            onSolve();
          } else {
            setFeedback(lang === "zh" ? `刻度 ${currentVal} 不正确！第3段密码请看月历红圈日期 (28)，锁芯已重置。` : `Number ${currentVal} is incorrect. Lock resets.`);

      return h("div", { className: "fixed inset-0 z-50 flex items-center justify-center bg-black/85 backdrop-blur-sm p-4" },

            onClick: onClose,

          }, lang === "zh" ? "✕ 关闭" : "✕ CLOSE"),
          h("h2", { className: "text-2xl font-bold uppercase tracking-wider text-[#d4af37] mb-1 flex items-center gap-2" },
            h("span", null, "🗝"),

            lang === "zh" ? "1928年专利三段式机械转盘密码箱（密码：10 - 4 - 28）" : "Patented Cast-Steel Combination Vault Lock (10 - 4 - 28)"

            h("button", { disabled: solved, onClick: () => turnDial(5), className: "px-3 py-2 bg-[#3d3229] hover:bg-[#594738] text-white rounded font-mono font-bold border border-[#78614c] disabled:opacity-40" }, "+5")
          ),
          h("div", { className: "flex items-center gap-2 mt-4 text-xs font-mono text-[#a3907c]" },

            h("span", { className: `px-2 py-0.5 rounded ${stage >= 2 || solved ? "bg-green-900 text-green-200" : "bg-gray-800"}` }, "2: [4]"),

    // ================= Puzzle 4: Steampunk Cryptex Modal =================
    const WHEELS = [
      ["L", "A", "K", "M", "P", "T"],
      ["U", "E", "O", "I", "A", "Y"],
      ["X", "S", "Z", "C", "V", "B"],
      ["O", "I", "U", "E", "A", "R"],
      ["R", "T", "S", "N", "D", "L"],
    ];
    function CryptexModal({ onClose, onSolve, isAlreadySolved, cryptexImage, lang }) {
      const [indices, setIndices] = useState(isAlreadySolved ? [0, 0, 0, 0, 0] : [2, 3, 1, 4, 2]);
      const [solved, setSolved] = useState(isAlreadySolved);
      const [feedback, setFeedback] = useState(
        isAlreadySolved
          ? (lang === "zh" ? "密码筒内胆已抽出，纯金逃生总钥匙就在手中！" : "The cryptex cylinder has separated! The master exit key is inside!")
          : (lang === "zh" ? "拨动 5 个字母转环，在红线处拼出古埃及神庙之城密语：L - U - X - O - R！" : "Turn the 5 brass letter rings to align the cipher word: L - U - X - O - R.")
      );

      const rotateWheel = (wheelIdx, step) => {
        if (solved) return;
        sfx.tumbler();
        setIndices((prev) => {
          const next = [...prev];
          const len = WHEELS[wheelIdx].length;
          next[wheelIdx] = (next[wheelIdx] + step + len) % len;
          const currentWord = next.map((idx, w) => WHEELS[w][idx]).join("");
          if (currentWord === "LUXOR") {
            sfx.gearClunk();
            setTimeout(() => sfx.puzzleSolved(), 250);
            setSolved(true);
            setFeedback(lang === "zh" ? "嗤——气压阀开启！密码筒旋开，露出了金光闪闪的「纯金逃生总钥匙」！" : "A heavy pneumatic hiss! The cryptex unscrews to reveal the Golden Master Key!");
            onSolve();
          } else {
            setFeedback(lang === "zh" ? `当前排列：${currentWord}（目标暗号：LUXOR）` : `Current alignment: ${currentWord} (Target: LUXOR)`);
          }
          return next;
        });
      };

      return h("div", { className: "fixed inset-0 z-50 flex items-center justify-center bg-black/85 backdrop-blur-sm p-4" },
        h("div", { className: "relative w-full max-w-4xl bg-[#e3d5be] border-4 border-[#3c2a1a] rounded-lg shadow-2xl p-6 text-[#2a1c12] flex flex-col md:flex-row gap-6" },
          h("button", {
            onClick: onClose,
            className: "absolute top-3 right-3 bg-[#3c2a1a] text-[#e3d5be] px-3 py-1 text-sm font-bold rounded hover:bg-[#5a3e26] border border-[#8c6747]"
          }, lang === "zh" ? "✕ 关闭" : "✕ CLOSE"),
          h("div", { className: "md:w-1/2 flex flex-col items-center" },
            h("div", { className: "relative border-4 border-[#5a3e26] rounded-md overflow-hidden shadow-inner bg-[#26170d] w-full" },
              h("img", { src: cryptexImage, alt: "Steampunk Cryptex", className: "w-full h-auto object-cover max-h-[320px]" }),
              solved && h("div", { className: "absolute inset-0 bg-[#d4af37]/25 flex items-center justify-center" },
                h("span", { className: "bg-[#2a1a0c] text-[#d4af37] px-4 py-2 rounded-lg font-bold border-2 border-[#d4af37] shadow-xl text-lg" },
                  lang === "zh" ? "✓ 密码筒已破译" : "CYLINDER UNLOCKED"
                )
              )
            ),
            h("div", { className: "mt-3 text-xs text-[#5c4028] text-center italic bg-[#d9c7a7] p-2 rounded border border-[#bda582] w-full" },
              lang === "zh"
                ? "“追寻尼罗河畔的卢克索神庙之光（LUXOR）——那是照亮暗夜的秘钥。” —— 菲利克斯侦探笔记"
                : "“Seek the light of Egyptian ruins — LUXOR, the city of palaces.” — Inspector Felix's Clue"
            )
          ),
          h("div", { className: "md:w-1/2 flex flex-col justify-between" },
            h("div", null,
              h("div", { className: "border-b-2 border-[#8c6747] pb-2 mb-3" },
                h("h2", { className: "text-2xl font-bold tracking-wide text-[#3c2a1a] uppercase flex items-center gap-2" },
                  h("span", null, "🔐"),
                  lang === "zh" ? "第四关：蒸汽朋克密码筒" : "The Steampunk Cryptex"
                ),
                h("p", { className: "text-xs text-[#6e4e32]" },
                  lang === "zh" ? "五重黄铜字母转环解码器" : "Professor Layton Style Word Lock Mechanism"
                )
              ),
              h("p", { className: "text-sm leading-relaxed mb-4 bg-[#f2e7d3] p-3 rounded border border-[#caa982]" }, feedback),
              h("div", { className: "relative flex justify-center items-center py-4 bg-[#23150c] rounded-xl border-4 border-[#78532f] shadow-inner" },
                h("div", { className: "absolute left-2 right-2 h-10 border-y-2 border-red-500/80 bg-red-950/20 pointer-events-none z-10 flex justify-between items-center px-1" },
                  h("span", { className: "text-red-500 text-xs font-bold" }, "▶"),
                  h("span", { className: "text-red-500 text-xs font-bold" }, "◀")
                ),
                h("div", { className: "grid grid-cols-5 gap-2 px-6 z-20" },
                  indices.map((val, wIdx) => {
                    const letters = WHEELS[wIdx];
                    const len = letters.length;
                    const prevLetter = letters[(val - 1 + len) % len];
                    const currentLetter = letters[val];
                    const nextLetter = letters[(val + 1) % len];
                    return h("div", { key: wIdx, className: "flex flex-col items-center" },
                      h("button", {
                        disabled: solved,
                        onClick: () => rotateWheel(wIdx, -1),
                        className: "w-8 h-7 bg-[#8c6747] hover:bg-[#a67c52] text-white text-xs font-bold rounded-t flex items-center justify-center disabled:opacity-40"
                      }, "▲"),
                      h("div", { className: "w-10 bg-[#e8ddc9] text-[#2c1d11] font-mono text-center border-x-2 border-[#5c4028] shadow-inner py-1" },
                        h("div", { className: "text-[10px] text-[#998369] opacity-60 h-4" }, prevLetter),
                        h("div", { className: "text-xl font-black text-[#852815] bg-[#fff6e6] py-1 border-y border-[#ab8a6b]" }, currentLetter),
                        h("div", { className: "text-[10px] text-[#998369] opacity-60 h-4" }, nextLetter)
                      ),
                      h("button", {
                        disabled: solved,
                        onClick: () => rotateWheel(wIdx, 1),
                        className: "w-8 h-7 bg-[#8c6747] hover:bg-[#a67c52] text-white text-xs font-bold rounded-b flex items-center justify-center disabled:opacity-40"
                      }, "▼")
                    );
                  })

              )
            ),
            h("div", { className: "pt-4 border-t border-[#8c6747] flex justify-between items-center" },
              h("button", {

                  setSolved(true);
                  sfx.puzzleSolved();
                  setFeedback(lang === "zh" ? "LUXOR 暗号匹配成功！已获得纯金逃生总钥匙！" : "LUXOR cipher matched! Master exit key obtained!");
                  onSolve();
                },
                className: "text-xs text-[#7c5a3a] hover:underline font-bold"
              }, lang === "zh" ? "[ 🐾 猫咪侦探一键破译 ]" : "[ Inspector Felix Auto-Solve ]"),
              solved && h("span", { className: "text-xs bg-[#4a7c38] text-white px-3 py-1 rounded-full font-bold" },
                lang === "zh" ? "✓ 已获纯金总钥匙" : "✓ Master Key Acquired"
              )
            )
          )
        )
      );
    }

                      ? "🔒 死锁尚未解除！请按顺序解开：① 机关书架 → ② 黄铜机关盒 → ③ 墙面保险箱 → ④ 蒸汽朋克密码筒，拿到总钥匙后再来开门！"
                      : "The deadbolt is firmly engaged. Decode Whitmore's cryptex to retrieve the master key first!"
                  )
            )
          ),

          h("div", { className: "mt-4 text-right" },
            h("button", {
              onClick: onClose,
              className: "px-4 py-1.5 bg-[#3d2b1c] text-[#efe3cf] rounded hover:bg-[#573e28] text-xs font-bold"
            }, lang === "zh" ? "返回办公室" : "Back to Office")
          )
        )
      );
    }

        h("div", { className: "relative bg-[#efe3cf] border-4 border-[#3b2716] rounded-xl shadow-2xl p-4 flex items-center gap-4 text-[#2b1c10]" },
          h("div", { className: "relative w-20 h-20 sm:w-24 sm:h-24 flex-shrink-0 border-4 border-[#593b22] rounded-full overflow-hidden bg-[#24180d] shadow-md ring-2 ring-[#d4af37]" },
            h("img", { src: catImage, alt: "Inspector Felix Claws", className: "w-full h-full object-cover" })
          ),

            h("div", { className: "flex justify-between items-center mb-1" },
              h("span", { className: "text-sm font-bold uppercase tracking-wide text-[#802a1b] flex items-center gap-1.5" },
                h("span", null, "🐾"),
                lang === "zh" ? "猫咪神探 · 菲利克斯 (Felix Claws)" : "Inspector Felix Claws"
              ),
              h("span", { className: "text-[10px] bg-[#d9c5a3] text-[#593d25] px-2 py-0.5 rounded font-mono border border-[#ab9573]" }, progressPhase)
            ),
            h("p", { className: "text-xs sm:text-sm leading-snug italic bg-[#fbf5e9] p-3 rounded border border-[#cbbaa1] shadow-inner" },

              className: "bg-[#3b2716] hover:bg-[#593b22] text-[#fbf5e9] px-3 py-1.5 text-xs font-bold rounded shadow"
            }, lang === "zh" ? "明白！🐾" : "Got it!")
          )

      );

    // ================= 90s LucasArts Verb Bar & Inventory =================
    function VerbBar({ currentVerb, onSelectVerb, inventory, selectedItem, onSelectItem, onInspectItem, filmGrainEnabled, onToggleFilmGrain, onResetGame, lang }) {
      const VERBS = [
        { id: "look", label: lang === "zh" ? "观察调查" : "Look at", icon: "🔍" },
        { id: "pickup", label: lang === "zh" ? "拾取搜寻" : "Pick up", icon: "✋" },
        { id: "talk", label: lang === "zh" ? "询问猫咪" : "Talk / Felix", icon: "💬" },
        { id: "use", label: lang === "zh" ? "操作机关" : "Use item", icon: "⚙" },
      ];
      return h("footer", { className: "w-full bg-[#20150d] border-t-4 border-[#422d1c] p-2 text-[#d9c7a7] shadow-2xl flex flex-col md:flex-row items-stretch justify-between gap-2 z-30" },
        h("div", { className: "grid grid-cols-4 gap-1.5 md:w-5/12 bg-[#170e08] p-1.5 rounded border border-[#382415]" },
          VERBS.map((v) => {
            const isActive = currentVerb === v.id;
            return h("button", {
              key: v.id,
              onClick: () => { sfx.click(); onSelectVerb(v.id); },
              className: `flex items-center justify-center gap-1 py-1.5 px-2 rounded text-xs font-bold tracking-wider uppercase transition-all ${
                isActive ? "bg-[#8c6747] text-white shadow ring-2 ring-[#d4af37]" : "bg-[#2b1b11] hover:bg-[#3d2719] text-[#c9b79b] border border-[#4a3220]"
              }`
            }, h("span", null, v.icon), h("span", null, v.label));
          })
        ),
        h("div", { className: "flex-1 bg-[#170e08] p-1.5 rounded border border-[#382415] flex items-center gap-2 overflow-x-auto min-h-[48px]" },
          h("span", { className: "text-[11px] font-bold text-[#c99b3b] px-1.5 whitespace-nowrap" },
            lang === "zh" ? "🎒 证物袋:" : "Case Bag:"
          ),
          inventory.map((item) => {
            const isSelected = selectedItem && selectedItem.id === item.id;
            return h("div", {
              key: item.id,
              onClick: () => { sfx.click(); onSelectItem(item); },
              onDoubleClick: () => { sfx.click(); onInspectItem(item); },
              title: `${item.name} - ${item.description}`,
              className: `relative flex items-center gap-1.5 px-2.5 py-1 rounded cursor-pointer border text-xs font-mono transition-all ${
                isSelected ? "bg-[#d4af37]/25 border-[#d4af37] text-white shadow-md" : "bg-[#2b1b11] hover:bg-[#3d2719] border-[#4a3220] text-[#ecdcc8]"
              }`
            },
              h("span", { className: "text-base" }, item.icon),
              h("span", { className: " whitespace-nowrap" }, item.name),
              item.canInspect && h("button", {
                onClick: (e) => { e.stopPropagation(); sfx.click(); onInspectItem(item); },
                className: "ml-1 text-[10px] bg-[#8c6747] text-white px-1.5 py-0.5 rounded hover:bg-[#a67c52] font-bold"
              }, lang === "zh" ? "点击破译" : "Inspect")
            );
          })
        ),
        h("div", { className: "flex items-center gap-2 justify-end px-2" },
          h("button", {
            onClick: () => { sfx.click(); onToggleFilmGrain(); },
            className: `px-2.5 py-1 text-[11px] font-bold rounded border transition-colors flex items-center gap-1 ${
              filmGrainEnabled ? "bg-[#5e3c27] text-[#fff] border-[#916241]" : "bg-[#26170d] text-[#856a52] border-[#422c1b]"
            }`
          }, h("span", null, "📽"), lang === "zh" ? `胶片感:${filmGrainEnabled ? "开" : "关"}` : `Grain:${filmGrainEnabled ? "ON" : "OFF"}`),
          h("button", {
            onClick: () => { sfx.click(); onResetGame(); },
            className: "px-2.5 py-1 text-[11px] font-bold rounded bg-[#381f18] hover:bg-[#52291f] text-[#f2b9ac] border border-[#693123]"
          }, lang === "zh" ? "重置密室" : "Restart")
        )
      );
    }

    // ================= Main Detective Game Component =================
    function DetectiveGame() {
      const [lang, setLang] = useState("zh");
      const [currentVerb, setCurrentVerb] = useState("look");
      const [inventory, setInventory] = useState([
        {
          id: "magnifier",
          name: "发光放大镜",
          icon: "🔍",
          description: "菲利克斯猫的发光放大镜，能揭示隐藏的微观印记与古老暗语。"
        }
      ]);
      const [selectedItem, setSelectedItem] = useState(null);
      const [bookshelfSolved, setBookshelfSolved] = useState(false);
      const [puzzleBoxSolved, setPuzzleBoxSolved] = useState(false);
      const [safeSolved, setSafeSolved] = useState(false);
      const [cryptexSolved, setCryptexSolved] = useState(false);
      const [hasEscaped, setHasEscaped] = useState(false);
      const [activeModal, setActiveModal] = useState(null);
      const [isDialogueOpen, setIsDialogueOpen] = useState(true);
      const [dialogueText, setDialogueText] = useState(
        "惠特莫尔侦探失踪了，有人锁死了这间1930年代侦探办公室的电子机械门栓！快点击画面中的【侦探格言】、【红木书架】和【办公桌】搜寻线索，我们一定能逃出去！"
      );
      const [actionNarrative, setActionNarrative] = useState(
        "1930年代复古侦探办公室：百叶窗透入清冷月光，办公桌上的神秘黄铜魔盒泛着金光。"
      );
      const [filmGrainEnabled, setFilmGrainEnabled] = useState(true);
      const [lampOn, setLampOn] = useState(true);

      const getCurrentHint = () => {
        if (lang === "zh") {
          if (!bookshelfSolved) return "第一步：看墙上相框里的格言 \"Truth Always Finds A Way\"，再点击【机关书架】按顺序抽动第 I、III、V、VI 本古书！";
          if (!puzzleBoxSolved) return "第二步：查看桌上的【打字机案卷】，然后点击发光的【黄铜机关盒】，依次对齐 ★ 星星、☾ 新月、👁 全视之眼、▲ 金字塔！";
          if (!safeSolved) return "第三步：点击右侧墙上的【入墙保险箱】，输入三段密码：10（挂钟时间）→ 4（书桌抽屉号）→ 28（月历红圈日期）！";
          if (!cryptexSolved) return "第四步：点击下方证物袋里的【🔐 蒸汽朋克密码筒】（或点击破译按钮），拼出 5 字母暗号 LUXOR！";
          return "终局：我们已经拿到【🔑 纯金逃生总钥匙】了！快点击左侧【密室大门】开锁逃出生天吧！";
        } else {
          if (!bookshelfSolved) return "Step 1: Check the wall motto 'Truth Always Finds A Way', then click the Bookshelf and pull books I, III, V, VI!";
          if (!puzzleBoxSolved) return "Step 2: Read the Typewriter memo, then align Star (★), Moon (☾), Eye (👁), and Pyramid (▲) on the Brass Puzzle Box!";
          if (!safeSolved) return "Step 3: Open the Wall Safe using the 3-number code: 10 (Clock) -> 4 (Desk Drawer) -> 28 (Calendar)!";
          if (!cryptexSolved) return "Step 4: Click the Steampunk Cryptex in your Case Bag below and spell 'LUXOR'!";
          return "Final Step: We have the Golden Master Key! Click the Exit Door on the left to escape!";
        }
      };

      const getProgressPhase = () => {
        if (lang === "zh") {
          if (!bookshelfSolved) return "第一阶段：机关书架 (1/4)";
          if (!puzzleBoxSolved) return "第二阶段：黄铜机关盒 (2/4)";
          if (!safeSolved) return "第三阶段：重型保险箱 (3/4)";
          if (!cryptexSolved) return "第四阶段：蒸汽密码筒 (4/4)";
          return "终局：开启大门逃脱！";
        } else {
          if (!bookshelfSolved) return "Phase 1: Secret Bookshelf";
          if (!puzzleBoxSolved) return "Phase 2: The Brass Box";
          if (!safeSolved) return "Phase 3: The Wall Vault";
          if (!cryptexSolved) return "Phase 4: Cryptex Decoding";
          return "Final: Escape Office";
        }
      };

      const handleHotspotClick = (hotspotId) => {
        sfx.click();
        switch (hotspotId) {
          case "cat":
            sfx.catMeow();
            setIsDialogueOpen(true);
            setDialogueText(getCurrentHint());
            setActionNarrative(lang === "zh" ? "猫咪侦探菲利克斯警觉地动了动胡须，压了压礼帽，给出了当前推理提示。" : "Inspector Felix Claws twitches his whiskers and adjusts his fedora.");
            break;
          case "poster":
            sfx.clueReveal();
            setActionNarrative(lang === "zh" ? "墙上相框写着侦探格言：“TRUTH ALWAYS FINDS A WAY”（真相总会找到出路）。" : "Framed Wall Motto reads: 'TRUTH ALWAYS FINDS A WAY'.");
            setIsDialogueOpen(true);
            setDialogueText(lang === "zh" ? "注意格言里的四个核心词：Truth... Always... Finds... Way！去点旁边的【机关书架】按顺序抽书吧！" : "Notice the word order: Truth -> Always -> Finds -> Way! Now click the Bookshelf!");
            break;
          case "bookshelf":
            setActiveModal("bookshelf");
            setActionNarrative(lang === "zh" ? "正在调查维多利亚红木书架上的古籍机关。" : "Examining the mahogany bookshelf.");
            break;
          case "desk_lamp":
            setLampOn(!lampOn);
            setActionNarrative(lampOn ? (lang === "zh" ? "你关掉了绿罩银行家台灯，房间暗了下来。" : "You switched off the green banker's lamp.") : (lang === "zh" ? "你按下黄铜开关，翡翠绿台灯洒下温暖光芒。" : "You clicked the brass switch. Warm light fills the desk."));
            break;
          case "typewriter":
            sfx.typewriter();
            setActiveModal("typewriter");
            setActionNarrative(lang === "zh" ? "正在阅读惠特莫尔留在 1931 打字机上的绝密备忘录。" : "Examining Whitmore's Underwood 1931 typewriter memorandum.");
            break;
          case "puzzle_box":
            setActiveModal("puzzlebox");
            setActionNarrative(lang === "zh" ? "仔细端详书桌上嗡嗡作响的精密黄铜星辰机关盒。" : "Examining the glowing mechanical Brass Puzzle Box.");
            break;
          case "wall_safe":
            if (!bookshelfSolved) {
              setActionNarrative(lang === "zh" ? "墙面保险箱被机械联锁保护，请先解开【机关书架】！" : "Solve the bookshelf mechanism first!");
              setIsDialogueOpen(true);
              setDialogueText(lang === "zh" ? "拍档，先去点中间的【📚 机关书架】解开第一道机关吧！" : "Let's solve the bookshelf first, pal!");
            } else {
              setActiveModal("safe");
              setActionNarrative(lang === "zh" ? "走近嵌在墙壁深处的惠特莫尔重型铸钢金库。" : "Approaching the heavy cast-steel wall vault safe.");
            }
            break;
          case "calendar":
            setActiveModal("calendar");
            setActionNarrative(lang === "zh" ? "查看保险箱旁悬挂的 1931 年 9 月月历（28日被红笔圈出）。" : "Looking at the September 1931 calendar (28th circled in red).");
            break;
          case "wall_clock":
            sfx.clueReveal();
            setActionNarrative(lang === "zh" ? "复古黄铜挂钟滴答作响，时针稳稳指向【10:00】，书桌右侧抽屉铭牌写着【NO. 4】！" : "The antique wall clock points strictly to 10:00, and the desk drawer is labeled NO. 4!");
            setIsDialogueOpen(true);
            setDialogueText(lang === "zh" ? "重要线索！挂钟指向【10】，书桌抽屉是【4】号，月历红圈是【28】日——这就是墙面保险箱的三段密码：10 - 4 - 28！" : "Clue found! Clock [10], Desk Drawer [4], Calendar [28] -> Safe code: 10 - 4 - 28!");
            break;
          case "coat_rack":
            if (!inventory.some((i) => i.id === "coat_key")) {
              sfx.itemPickup();
              setInventory((prev) => [
                ...prev,
                { id: "coat_key", name: lang === "zh" ? "黄铜拨片钥匙" : "Brass Dial Key", icon: "🗝", description: "在惠特莫尔风衣口袋里摸出的小型黄铜钥匙。" }
              ]);
              setActionNarrative(lang === "zh" ? "你在衣帽架的风衣口袋里搜出了一把精巧的【黄铜拨片钥匙】！" : "You found a Brass Dial Key in the trench coat pocket!");
            } else {
              setActionNarrative(lang === "zh" ? "衣帽架上挂着惠特莫尔的备用礼帽和淋湿的侦探风衣。" : "Whitmore's spare fedora and trench coat hang on the brass stand.");
            }
            break;
          case "door":
            setActiveModal("door");
            break;
          case "window":
            sfx.clueReveal();
            setActionNarrative(lang === "zh" ? "清冷月光透过百叶窗洒入室内，窗外是1930年代迷雾笼罩的不夜城。" : "Moonlight filters through the Venetian blinds over the 1930s cityscape.");
            break;
        }
      };

      const onBookshelfSolved = () => {
        setBookshelfSolved(true);
        if (!inventory.some((i) => i.id === "gear_wrench")) {
          sfx.itemPickup();
          setInventory((prev) => [
            ...prev,
            { id: "gear_wrench", name: lang === "zh" ? "钟表匠微调扳手" : "Watchmaker Tool", icon: "🔧", description: "用于调整精密机关齿轮的微型工具。" }
          ]);
        }
        setActionNarrative(lang === "zh" ? "秘密书架侧滑开来，暗格弹出，书桌上的黄铜机关盒开始啮合通电！" : "The secret shelf swung open!");
        setDialogueText(lang === "zh" ? "太棒了！现在去点书桌上的【⚙ 黄铜机关盒】，按 ★ ☾ 👁 ▲ 顺序解开它！" : "Splendid! Now click the Brass Puzzle Box on the desk!");
      };

      const onPuzzleBoxSolved = () => {
        setPuzzleBoxSolved(true);
        if (!inventory.some((i) => i.id === "safe_dial")) {
          sfx.itemPickup();
          setInventory((prev) => [
            ...prev,
            { id: "safe_dial", name: lang === "zh" ? "银质保险箱旋钮" : "Silver Vault Dial", icon: "⚙", description: "精密车削的金属转盘旋钮，用于开启墙面保险箱。" }
          ]);
        }
        setActionNarrative(lang === "zh" ? "机关盒弹开！你获得了【银质保险箱旋钮】！" : "The brass box lid swung open! You got the Silver Vault Dial.");
        setDialogueText(lang === "zh" ? "喵呜！拿着旋钮去点右侧墙上的【🗝 入墙保险箱】，输入密码 10 - 4 - 28！" : "Purr-fect! Now click the Wall Safe on the right wall (Code: 10 - 4 - 28)!");
      };

      const onSafeSolved = () => {
        setSafeSolved(true);
        if (!inventory.some((i) => i.id === "cryptex")) {
          sfx.itemPickup();
          setInventory((prev) => [
            ...prev,
            { id: "cryptex", name: lang === "zh" ? "蒸汽朋克密码筒" : "Steampunk Cryptex", icon: "🔐", description: "带有5重字母拨环的解码器（点击即可破译）", canInspect: true }
          ]);
        }
        setActionNarrative(lang === "zh" ? "保险箱厚重的钢门滑开！你获得了【🔐 蒸汽朋克密码筒】！" : "The vault door swings open! You retrieved the Steampunk Cryptex!");
        setDialogueText(lang === "zh" ? "密码筒到手了！快点击下方证物袋里的【🔐 蒸汽朋克密码筒 · 点击破译】，拼出暗号 LUXOR！" : "Click the Steampunk Cryptex in your Case Bag below to crack the 5-letter cipher LUXOR!");
      };

      const onCryptexSolved = () => {
        setCryptexSolved(true);
        if (!inventory.some((i) => i.id === "master_key")) {
          sfx.itemPickup();
          setInventory((prev) => [
            ...prev,
            { id: "master_key", name: lang === "zh" ? "纯金逃生总钥匙" : "Golden Master Key", icon: "🔑", description: "能解除办公室橡木大门电子死锁的华丽总钥匙！" }
          ]);
        }
        setActionNarrative(lang === "zh" ? "密码筒内胆弹出，你拿到了【🔑 纯金逃生总钥匙】！" : "The cryptex cylinder split open, revealing the Golden Master Key!");
        setDialogueText(lang === "zh" ? "总钥匙到手啦！立刻点击左侧的【🚪 密室大门】开锁逃出密室吧！" : "We got the Master Key! Click the Exit Door on the left to escape!");
      };

      const resetGame = () => {
        setBookshelfSolved(false);
        setPuzzleBoxSolved(false);
        setSafeSolved(false);
        setCryptexSolved(false);
        setHasEscaped(false);
        setInventory([{ id: "magnifier", name: lang === "zh" ? "发光放大镜" : "Glowing Lens", icon: "🔍", description: "菲利克斯猫的发光放大镜。" }]);
        setSelectedItem(null);
        setActiveModal(null);
        setActionNarrative(lang === "zh" ? "密室已重置。你正站在惠特莫尔侦探反锁的办公室中。" : "Scenario reset.");
        setDialogueText(lang === "zh" ? "回到起点啦，拍档！让我们再搜寻一遍，逃出密室！" : "Back at square one, partner!");
        setIsDialogueOpen(true);
      };

      return h("div", { className: "relative w-screen h-screen bg-[#120b07] flex flex-col justify-between overflow-hidden select-none" },
        h(FilmGrainOverlay, { enabled: filmGrainEnabled }),

        // Header
        h("header", { className: "relative z-20 w-full bg-[#1e130a] border-b-4 border-[#3d2716] px-4 py-2 flex flex-col sm:flex-row items-center justify-between text-[#ecdcc8] shadow-lg" },
          h("div", { className: "flex items-center gap-3" },
            h("span", { className: "text-2xl" }, "🐱🕵️"),
            h("div", null,
              h("h1", { className: "text-base sm:text-lg font-black tracking-wider text-[#d4af37] uppercase" },
                lang === "zh" ? "机密密室：密码猫与黄铜魔盒" : "Cipher Cat & The Mystery of the Brass Box"
              ),
              h("p", { className: "text-[10px] text-[#9c846d] font-mono" },
                lang === "zh" ? "1930年代复古侦探密室解谜 • 点击画面中的发光线索即可互动破案" : "1930s Point-and-Click Detective Escape Adventure"
              )
            )
          ),
          h("div", { className: "flex items-center gap-2 mt-1 sm:mt-0" },
            h("div", { className: "max-w-md text-center sm:text-right text-xs italic text-[#e0cfbb] bg-[#2d1c10] px-3 py-1 rounded border border-[#523722] truncate" },
              `“${actionNarrative}”`
            ),
            h("button", {
              onClick: () => { sfx.click(); setIsDialogueOpen(!isDialogueOpen); },
              className: "px-2.5 py-1 bg-[#593b22] hover:bg-[#78502e] text-[#fef08a] text-xs font-bold rounded border border-[#9c6f44]"
            }, lang === "zh" ? "🐾 提示" : "🐾 Hint"),
            h("button", {
              onClick: () => { sfx.click(); setLang(lang === "zh" ? "en" : "zh"); },
              className: "px-2.5 py-1 bg-[#3d2716] hover:bg-[#59391f] text-white text-xs font-bold rounded border border-[#7a5232]"
            }, lang === "zh" ? "EN" : "中文")
          )
        ),

        // Main Room Scene
        h("main", { className: "relative flex-1 w-full h-full flex items-center justify-center p-2 sm:p-4 overflow-hidden" },
          h("div", { className: "relative w-full max-w-[1380px] aspect-video max-h-[80vh] rounded-lg overflow-hidden border-4 border-[#422e1d] shadow-[0_0_50px_rgba(0,0,0,0.9)] bg-black" },
            h("img", {
              src: ASSETS.OFFICE,
              alt: "1930s Detective Office",
              className: "w-full h-full object-cover pointer-events-none",
              style: { filter: lampOn ? "brightness(1.03) contrast(1.04)" : "brightness(0.72) contrast(1.15)" }
            }),

            // Hotspot 1: Cat
            h("button", {
              onClick: () => handleHotspotClick("cat"),
              className: "absolute left-[11%] bottom-[22%] w-[10%] h-[26%] cursor-pointer group focus:outline-none"
            },
              h("div", { className: "w-full h-full rounded-full border-2 border-amber-400/30 group-hover:border-[#d4af37] group-hover:bg-[#d4af37]/20 transition-all flex items-start justify-center" },
                h("span", { className: "bg-[#2b190f]/90 text-[#f5ebd7] text-[10px] font-bold px-2 py-0.5 rounded shadow border border-[#7a5232] -translate-y-4" },
                  lang === "zh" ? "🐾 猫咪神探" : "🐾 Felix"
                )
              )
            ),

            // Hotspot 2: Motto Poster
            h("button", {
              onClick: () => handleHotspotClick("poster"),
              className: "absolute left-[19%] top-[7%] w-[7%] h-[18%] cursor-pointer group focus:outline-none"
            },
              h("div", { className: "w-full h-full rounded border-2 border-amber-400/30 group-hover:border-[#d4af37] group-hover:bg-[#d4af37]/20 transition-all flex items-end justify-center" },
                h("span", { className: "bg-[#2b190f]/90 text-[#f5ebd7] text-[10px] font-bold px-1.5 py-0.5 rounded shadow border border-[#7a5232] translate-y-5" },
                  lang === "zh" ? "📜 侦探格言" : "📜 Motto"
                )
              )
            ),

            // Hotspot 2b: Wall Clock
            h("button", {
              onClick: () => handleHotspotClick("wall_clock"),
              className: "absolute left-[27%] top-[8%] w-[5.5%] h-[13%] cursor-pointer group focus:outline-none"
            },
              h("div", { className: "w-full h-full rounded-full border-2 border-amber-400/30 group-hover:border-[#d4af37] group-hover:bg-[#d4af37]/20 transition-all flex items-end justify-center" },
                h("span", { className: "opacity-0 group-hover:opacity-100 bg-[#2b190f] text-[#f5ebd7] text-[10px] font-bold px-1.5 py-0.5 rounded shadow border border-[#7a5232] translate-y-5" },
                  lang === "zh" ? "🕰 10:00挂钟" : "🕰 Clock"
                )
              )
            ),

            // Hotspot 3: Bookshelf
            h("button", {
              onClick: () => handleHotspotClick("bookshelf"),
              className: "absolute left-[33%] top-[3%] w-[18%] h-[48%] cursor-pointer group focus:outline-none"
            },
              h("div", { className: "w-full h-full rounded border-2 border-amber-400/40 hotspot-hint group-hover:border-[#d4af37] group-hover:bg-[#d4af37]/20 transition-all flex items-center justify-center" },
                h("span", { className: "bg-[#2b190f]/90 text-[#f5ebd7] text-[11px] font-bold px-2.5 py-0.5 rounded shadow border border-[#d4af37]" },
                  `📚 ${lang === "zh" ? "① 机关书架" : "Bookshelf"} ${bookshelfSolved ? "✓" : ""}`
                )
              )
            ),

            // Hotspot 4: Desk Lamp
            h("button", {
              onClick: () => handleHotspotClick("desk_lamp"),
              className: "absolute left-[38%] top-[41%] w-[6%] h-[12%] cursor-pointer group focus:outline-none"
            },
              h("div", { className: "w-full h-full rounded border-2 border-transparent group-hover:border-emerald-400 group-hover:bg-emerald-400/20 transition-all" })
            ),

            // Hotspot 5: Typewriter
            h("button", {
              onClick: () => handleHotspotClick("typewriter"),
              className: "absolute left-[44%] top-[43%] w-[10%] h-[12%] cursor-pointer group focus:outline-none"
            },
              h("div", { className: "w-full h-full rounded border-2 border-amber-400/30 group-hover:border-[#d4af37] group-hover:bg-[#d4af37]/20 transition-all flex items-end justify-center" },
                h("span", { className: "bg-[#2b190f]/90 text-[#f5ebd7] text-[10px] font-bold px-2 py-0.5 rounded shadow border border-[#7a5232] translate-y-5" },
                  `⌨ ${lang === "zh" ? "打字机备忘录" : "Typewriter"}`
                )
              )
            ),

            // Hotspot 6: Glowing Mechanical Puzzle Box
            h("button", {
              onClick: () => handleHotspotClick("puzzle_box"),
              className: "absolute left-[53%] top-[52%] w-[6.5%] h-[11%] cursor-pointer group focus:outline-none"
            },
              h("div", { className: "w-full h-full rounded border-2 border-amber-400/70 bg-amber-400/10 hotspot-hint group-hover:border-amber-300 group-hover:bg-amber-300/30 transition-all flex items-end justify-center" },
                h("span", { className: "bg-[#2b190f]/95 text-[#fef08a] text-[10px] font-bold px-2 py-0.5 rounded shadow border border-[#d4af37] translate-y-5 whitespace-nowrap" },
                  `⚙ ${lang === "zh" ? "② 黄铜机关盒" : "Puzzle Box"} ${puzzleBoxSolved ? "✓" : ""}`
                )
              )
            ),

            // Hotspot 7: Wall Safe
            h("button", {
              onClick: () => handleHotspotClick("wall_safe"),
              className: "absolute right-[12%] top-[10%] w-[10%] h-[24%] cursor-pointer group focus:outline-none"
            },
              h("div", { className: "w-full h-full rounded border-2 border-amber-400/40 hotspot-hint group-hover:border-[#d4af37] group-hover:bg-[#d4af37]/20 transition-all flex items-end justify-center" },
                h("span", { className: "bg-[#2b190f]/90 text-[#f5ebd7] text-[11px] font-bold px-2 py-0.5 rounded shadow border border-[#d4af37] translate-y-4 whitespace-nowrap" },
                  `🗝 ${lang === "zh" ? "③ 入墙保险箱" : "Wall Safe"} ${safeSolved ? "✓" : ""}`
                )
              )
            ),

            // Hotspot 8: Calendar
            h("button", {
              onClick: () => handleHotspotClick("calendar"),
              className: "absolute right-[6%] top-[30%] w-[6%] h-[16%] cursor-pointer group focus:outline-none"
            },
              h("div", { className: "w-full h-full rounded border-2 border-amber-400/30 group-hover:border-[#d4af37] group-hover:bg-[#d4af37]/20 transition-all flex items-end justify-center" },
                h("span", { className: "bg-[#2b190f]/90 text-[#f5ebd7] text-[10px] font-bold px-1.5 py-0.5 rounded shadow border border-[#7a5232] translate-y-4" },
                  `📅 ${lang === "zh" ? "月历(28)" : "Calendar"}`
                )
              )
            ),

            // Hotspot 9: Exit Door
            h("button", {
              onClick: () => handleHotspotClick("door"),
              className: "absolute left-[2%] top-[14%] w-[12%] h-[58%] cursor-pointer group focus:outline-none"
            },
              h("div", { className: "w-full h-full rounded border-2 border-red-400/40 group-hover:border-red-400 group-hover:bg-red-400/15 transition-all flex items-center justify-center" },
                h("span", { className: "bg-[#2b190f]/90 text-[#f5ebd7] text-[11px] font-bold px-2 py-0.5 rounded shadow border border-red-700" },
                  `🚪 ${lang === "zh" ? "密室大门" : "Exit Door"}`
                )
              )
            ),

            // Hotspot 10: Coat Rack
            h("button", {
              onClick: () => handleHotspotClick("coat_rack"),
              className: "absolute left-[13%] top-[17%] w-[8%] h-[35%] cursor-pointer group focus:outline-none"
            },
              h("div", { className: "w-full h-full rounded border-2 border-transparent group-hover:border-[#d4af37] group-hover:bg-[#d4af37]/20 transition-all" })
            ),

            // Hotspot 11: Moonlit Window
            h("button", {
              onClick: () => handleHotspotClick("window"),
              className: "absolute left-[62%] top-[2%] w-[15%] h-[38%] cursor-pointer group focus:outline-none"
            },
              h("div", { className: "w-full h-full rounded border-2 border-transparent group-hover:border-sky-300 group-hover:bg-sky-300/10 transition-all" })
            )
          )
        ),

        // Detective Cat Dialogue
        h(DetectiveCatDialogue, {
          catImage: ASSETS.CAT,
          isOpen: isDialogueOpen,
          onClose: () => setIsDialogueOpen(false),
          currentHint: dialogueText,
          progressPhase: getProgressPhase(),
          lang
        }),

        // Modals
        activeModal === "bookshelf" && h(BookshelfModal, {
          isAlreadySolved: bookshelfSolved,
          onClose: () => setActiveModal(null),
          onSolve: onBookshelfSolved,
          lang
        }),
        activeModal === "puzzlebox" && h(PuzzleBoxModal, {
          boxImage: ASSETS.PUZZLE_BOX,
          isAlreadySolved: puzzleBoxSolved,
          onClose: () => setActiveModal(null),
          onSolve: onPuzzleBoxSolved,
          lang
        }),
        activeModal === "safe" && h(SafeModal, {
          isAlreadySolved: safeSolved,
          onClose: () => setActiveModal(null),
          onSolve: onSafeSolved,
          lang
        }),
        activeModal === "cryptex" && h(CryptexModal, {
          cryptexImage: ASSETS.CRYPTEX,
          isAlreadySolved: cryptexSolved,
          onClose: () => setActiveModal(null),
          onSolve: onCryptexSolved,
          lang
        }),
        (activeModal === "typewriter" || activeModal === "calendar" || activeModal === "door") && h(ClueInspectorModal, {
          type: activeModal,
          hasMasterKey: inventory.some((i) => i.id === "master_key"),
          onClose: () => setActiveModal(null),
          onDoorEscape: () => { setActiveModal(null); setHasEscaped(true); },
          lang
        }),

        // Victory Screen
        hasEscaped && h("div", { className: "fixed inset-0 z-50 bg-black/95 flex flex-col items-center justify-center p-6 text-center text-[#eddcca]" },
          h("div", { className: "max-w-2xl bg-[#2e1d11] p-8 rounded-2xl border-4 border-[#d4af37] shadow-2xl relative" },
            h("div", { className: "w-28 h-28 mx-auto rounded-full overflow-hidden border-4 border-[#d4af37] mb-4 bg-black" },
              h("img", { src: ASSETS.CAT, alt: "Detective Cat", className: "w-full h-full object-cover" })
            ),
            h("h2", { className: "text-3xl font-black uppercase text-[#d4af37] tracking-widest mb-2" },
              lang === "zh" ? "🎉 案件告破：成功逃脱密室！" : "🎉 Case Solved: The Great Escape!"
            ),
            h("p", { className: "text-xs font-mono text-[#a89078] mb-4" }, "1930s NOIR DETECTIVE MYSTERY • ESCAPE ROOM COMPLETED"),
            h("p", { className: "text-base leading-relaxed mb-6 bg-[#1f130b] p-4 rounded border border-[#593d25]" },
              lang === "zh"
                ? "“太出色了，我的神探拍档！我们成功破译了惠特莫尔的书架格言机关、理顺了黄铜星辰机关盒的四象齿轮、解开了入墙金库的 10-4-28 密码、并旋正了古老的 LUXOR 蒸汽朋克密码筒！夜雾迷蒙，让我们踏入1930年代的雨夜街头继续追查真相吧！”"
                : "“Outstanding investigative work, partner! Together we decoded Whitmore's secret library motto, aligned the Brass Puzzle Box, cracked the vault combination, and unscrambled the LUXOR cryptex!”"
            ),
            h("button", {
              onClick: resetGame,
              className: "px-6 py-3 bg-[#8c6747] hover:bg-[#ad7e54] text-white font-bold rounded-lg shadow-lg uppercase tracking-wider text-sm"
            }, lang === "zh" ? "🔄 再玩一次" : "🔄 Play Again")
          )
        ),

        // Bottom LucasArts Verb Bar
        h(VerbBar, {
          currentVerb,
          onSelectVerb: setCurrentVerb,
          inventory,
          selectedItem,
          onSelectItem: (item) => {
            setSelectedItem(item);
            if (item.id === "cryptex") {
              setActiveModal("cryptex");
            } else {
              setActionNarrative(lang === "zh" ? `已选中证物：${item.name}（${item.description}）` : `Selected item: ${item.name}`);
            }
          },
          onInspectItem: (item) => {
            if (item.id === "cryptex") {
              setActiveModal("cryptex");
            } else {
              setActionNarrative(lang === "zh" ? `正在检视 ${item.name}：${item.description}` : `Inspecting ${item.name}`);
            }
          },
          filmGrainEnabled,
          onToggleFilmGrain: () => setFilmGrainEnabled(!filmGrainEnabled),
          onResetGame: resetGame,
          lang
        })
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(h(DetectiveGame));
  </script>
</body>
</html>
